<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#171a21"/>
      <stop offset="1" stop-color="#0d0f14"/>
    </linearGradient>
  </defs>
  <!-- panel background -->
  <rect x="4" y="4" width="120" height="120" rx="22" fill="url(#bg)" stroke="#2a2d35" stroke-width="2"/>
  <!-- frets -->
  <g stroke="#2a2d35" stroke-width="2">
    <line x1="22" y1="34" x2="106" y2="34"/>
    <line x1="22" y1="58" x2="106" y2="58"/>
    <line x1="22" y1="82" x2="106" y2="82"/>
    <line x1="22" y1="106" x2="106" y2="106"/>
  </g>
  <!-- nut -->
  <rect x="22" y="16" width="84" height="5" rx="2.5" fill="#8b9099"/>
  <!-- strings -->
  <g stroke="#555a63" stroke-linecap="round">
    <line x1="28" y1="21" x2="28" y2="112" stroke-width="2"/>
    <line x1="42" y1="21" x2="42" y2="112" stroke-width="2.4"/>
    <line x1="86" y1="21" x2="86" y2="112" stroke-width="3.2"/>
    <line x1="100" y1="21" x2="100" y2="112" stroke-width="3.6"/>
  </g>
  <!-- vibrating string: second-harmonic standing wave -->
  <g fill="none" stroke-linecap="round">
    <path d="M 64 21 C 76 33, 76 45, 64 66 C 52 87, 52 99, 64 112"
          stroke="#4fc3f7" stroke-width="4"/>
    <path d="M 64 21 C 52 33, 52 45, 64 66 C 76 87, 76 99, 64 112"
          stroke="#4fc3f7" stroke-width="4" opacity="0.45"/>
  </g>
  <!-- nodes and antinodes -->
  <circle cx="64" cy="66" r="6" fill="#ffb74d"/>
  <circle cx="64" cy="21" r="4.5" fill="#81c784"/>
  <circle cx="64" cy="112" r="4.5" fill="#81c784"/>
</svg>
